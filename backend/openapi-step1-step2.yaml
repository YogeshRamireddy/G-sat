openapi: 3.1.0
info:
  title: PhytoMaps MVP API (Steps 1-2)
  version: 0.1.0
servers:
  - url: https://api.phytomaps.local
paths:
  /courses:
    post:
      summary: Create course with boundary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
  /courses/{course_id}/jobs/segmentation:
    post:
      summary: Trigger segmentation job
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{job_id}:
    get:
      summary: Get job status
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /courses/{course_id}/polygons:
    get:
      summary: Fetch predicted or validated polygons
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
        - in: query
          name: source
          required: true
          schema:
            type: string
            enum: [predicted, validated]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  polygons:
                    type: array
                    items:
                      $ref: '#/components/schemas/PolygonFeature'
  /courses/{course_id}/polygons/validated:
    put:
      summary: Upsert validated polygons
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatedPolygonBulkUpdate'
      responses:
        '200':
          description: Updated
  /courses/{course_id}/validation/finalize:
    post:
      summary: Finalize validation and labeling
      parameters:
        - in: path
          name: course_id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accepted
components:
  schemas:
    CreateCourseRequest:
      type: object
      required: [name, boundary]
      properties:
        name:
          type: string
        boundary:
          type: object
          description: GeoJSON Polygon or MultiPolygon in EPSG:4326
    Course:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        boundary: { type: object }
    Job:
      type: object
      properties:
        id: { type: string }
        course_id: { type: string }
        status:
          type: string
          enum: [queued, image_acquisition, tiling, inference, stitching, post_processing, polygonization, segmentation_complete, validation_in_progress, validation_complete, failed]
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
    PolygonFeature:
      type: object
      properties:
        id: { type: string }
        geometry: { type: object }
        class_type: { type: string, nullable: true }
        zone_type: { type: string, nullable: true }
        hole_id: { type: integer, nullable: true }
    ValidatedPolygonBulkUpdate:
      type: object
      required: [polygons]
      properties:
        polygons:
          type: array
          items:
            $ref: '#/components/schemas/PolygonFeature'
